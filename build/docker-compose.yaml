services:
  nginx:
    build:
      context: ../build/nginx
      dockerfile: ./Dockerfile
    container_name: nginx
    ports:
      - '80:80'
      - '443:443'
    environment:
      - CERTS_DIR=/etc/letsencrypt/live/${PUBLIC_DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../.mnt/certbot/letsencrypt:/etc/letsencrypt:ro
      - ../.mnt/certbot/www:/var/www/certbot:ro
    restart: always

  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    depends_on:
      - nginx
    env_file:
      - ../config/.env
    command: >-
      certonly --non-interactive --reinstall --webroot --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email
      -d ${PUBLIC_DOMAIN}
    volumes:
      - ../.mnt/certbot/letsencrypt:/etc/letsencrypt
      - ../.mnt/certbot/www:/var/www/certbot

  certbot-renew:
    container_name: certbot-renew
    image: certbot/certbot:latest
    depends_on:
      - nginx
    entrypoint: []
    command: |
      sh -c 'trap exit TERM; while :; do
        certbot renew --quiet;
        sleep 12h;
      done'
    volumes:
      - ../.mnt/certbot/letsencrypt:/etc/letsencrypt
      - ../.mnt/certbot/www:/var/www/certbot

  backend-delve:
    # build:
    #   context: ../
    #   dockerfile: ./build/debug/Dockerfile
    image: backend-debug:latest
    container_name: backend-delve
    restart: always
    env_file:
      - ../config/.env
    ports:
      - '8080:8080'
      - '${DELVE_PORT}:2345'

  backend:
    image: backend-prod:latest
    container_name: backend-prod
    restart: always
    env_file:
      - ../config/.env
    ports:
      - '8080:8080'

  web-auth:
    # build:
    #   context: ../
    #   dockerfile: ./build/web-auth/Dockerfile
    #   args:
    #     VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: web-auth:latest
    container_name: web-auth
    restart: always
    env_file:
      - ../config/.env
    ports:
      - '3000:3000'

  postgres:
    image: postgres:17.4-alpine3.21
    restart: always
    container_name: postgres
    env_file:
      - ../config/.env
    volumes:
      - ../.mnt/postgres:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'

  postgres-migrator:
    image: postgres:17.4-alpine3.21
    container_name: postgres-migrator
    environment:
      - POSTGRES_HOST=postgres
    env_file:
      - ../config/.env
    volumes:
      - ./postgres/apply-migrations.sh:/apply-migrations.sh:ro
      - ../migrations:/migrations
    entrypoint: ["/bin/sh", "/apply-migrations.sh"]
