server {
  client_max_body_size 1m;
  server_name {{ (getenv "PUBLIC_DOMAIN") }};
  listen 443 ssl;

  ssl_certificate /etc/letsencrypt/live/{{ (getenv "PUBLIC_DOMAIN") }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ (getenv "PUBLIC_DOMAIN") }}/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location /assets {
    proxy_pass http://web-auth:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth {
    proxy_pass http://web-auth:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://backend-prod:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
